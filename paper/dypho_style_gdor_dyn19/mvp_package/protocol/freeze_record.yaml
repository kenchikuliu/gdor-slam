rendering:
  pose_source: DYN-19 online and GT-aligned pose modes are labeled separately; selected input references use dataset timestamps.
  alignment: Tracking uses fixed-scale SE(3) without scale correction; mapping pose mode is explicit per row.
  crop_xywh: [0, 0, 640, 480]
  resolution: [640, 480]
  fit: contain
  color_space: sRGB
  post_processing: none
tracking_policy:
  frame_start: 0
  frame_end_exclusive: 1074
  association_max_delta_seconds: 0.02
  seed: "0,1,2; full per-sequence horizon, maximum 1074 input frames"
runtime_policy:
  runtime_source: DYN-19 run_summary end_to_end_seconds over all 210 tracking/ablation runs
  hardware_consistency: clean-single-gpu
  hardware_note: Every frozen DYN-19 task declares CUDA device 1, NVIDIA GeForce RTX 4090. External-report runtime rows retain their native hardware labels and are not pooled.
  clean_runtime_required: true
baseline_policy:
  allowed:
    - Photo-SLAM
    - SplaTAM
  local_rerun_priority:
    - Photo-SLAM
    - SplaTAM
  artifact_library_targets:
    - Photo-SLAM
    - SplaTAM
    - MonoGS
    - ORB-SLAM3
    - Dyna-SLAM
    - NICE-SLAM
    - ESLAM
    - RoDyn-SLAM
    - GS-SLAM
    - GassiDy
    - DGS-SLAM
    - VarSplat
    - Gaussian-SLAM
    - CG-SLAM
  external_report_allowed:
    - ORB-SLAM3
    - Dyna-SLAM
    - NICE-SLAM
    - ESLAM
    - RoDyn-SLAM
    - GS-SLAM
    - GassiDy
    - DGS-SLAM
    - DG-SLAM
  excluded:
    - Protocol-matched superiority claims from external-report rows.
    - Fig.4 panels for methods without real documented renders.
    - Zero-ghost or zero-contamination claims from proxy metrics or route certificates.
    - Independent causal-effect or interaction claims from the ordered ablation.
source_label_policy:
  local_rerun_label: local-rerun
  external_report_label: external-report
  diagnostic_label: diagnostic
  failed_boundary_label: failed-boundary
claim_boundary: DYN-19 provides complete local 90-run tracking, 120-run ordered-ablation, and 72-cell mapping diagnostics. It supports failure-regime tracking rescue and a recovered-support route invariant. External mapping rows retain native metrics and blank incompatible DYN-19 metric cells. The package does not provide protocol-matched external superiority, factorial component effects, or independent ghost/completeness truth.
